services:
  # Redis con los módulos RedisJSON y RediSearch, que exige el checkpointer de LangGraph.
  redis:
    image: redis/redis-stack-server:latest
    container_name: sistema-intelligence-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Arize Phoenix (observabilidad). Es opcional: `docker compose --profile observability up -d`
  # También se puede correr sin Docker con `pip install arize-phoenix` y `phoenix serve`.
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: sistema-intelligence-phoenix
    profiles: ["observability"]
    ports:
      - "6006:6006"   # interfaz web y recolector HTTP
      - "4317:4317"   # recolector gRPC
